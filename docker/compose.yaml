# PostgreSQL with pgvector for development. The app image arrives in phase F9.
name: spaceapp

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: spaceapp
      POSTGRES_PASSWORD: spaceapp
      POSTGRES_DB: spaceapp
    ports:
      - "${SPACEAPP_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spaceapp -d spaceapp"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
