# DRAFT by Dev B (F0). Pending Dev A review before freezing at I0.
# Subset of section 10.2 of the architecture plan: only what the F0 interface consumes.
# A contract change requires review by the other developer.

enum Severity {
  NORMAL
  ATTENTION
  ALERT
  CRITICAL
}

enum EvidenceState {
  VERIFIED
  TB
  DEMO
  UNVERIFIED
}

enum DataOrigin {
  REAL
  SIMULATED
  REPLAY
}

type Vital {
  key: String!
  label: String!
  value: Float!
  unit: String!
  # "cabin" or "body". Free text until A fixes the domain catalog.
  domain: String!
  severity: Severity!
  evidenceState: EvidenceState!
  origin: DataOrigin!
}

type DashboardView {
  habitatId: ID!
  globalSeverity: Severity!
  vitals: [Vital!]!
}

type Query {
  dashboard(habitatId: ID!): DashboardView!
}
