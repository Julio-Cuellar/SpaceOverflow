  sourceRequirement: String!
  sourceDocument: String!
  evidenceState: EvidenceState!
  actionKey: String!
  hrpHazard: String!
  kind: String!
  operator: String!
  threshold: Float!
  unit: String!
  windowS: Int!
}

enum Severity {
  NORMAL
