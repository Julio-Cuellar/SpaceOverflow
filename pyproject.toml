[project]
name = "spaceapp"
version = "0.1.0"
description = "Monitor de salud para astronautas (NASA Space Apps 2026). Prototipo de apoyo a la decisión, no es un dispositivo médico."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  # Conocimiento (dev B): extracción de texto de los PDFs de NASA.
  "pypdf>=5",
  "strawberry-graphql>=0.341.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "testcontainers[postgres]>=4.8",
  "hypothesis>=6.115",
  "ruff>=0.8",
  "mypy>=1.13",
  "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spaceapp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: necesita PostgreSQL real (testcontainers)",
]

[tool.coverage.run]
source = ["src/spaceapp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Las consultas SQL largas se leen mejor en una línea por cláusula.
"src/**/adapters/outbound/sql.py" = ["E501"]
# Las pruebas llevan consultas y datos largos que se leen mejor en una línea.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

# Voz local (Dev B): se instala solo donde hay Whisper; sin ella el sistema usa el adaptador nulo.
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "spaceapp"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Los módulos son independientes entre sí (solo se importan contracts y facade)"
type = "independence"
modules = ["spaceapp.modules.telemetry", "spaceapp.modules.monitoring", "spaceapp.modules.knowledge", "spaceapp.modules.assistant", "spaceapp.modules.crew", "spaceapp.modules.facility", "spaceapp.modules.engagement", "spaceapp.modules.groundlink", "spaceapp.modules.realtime"]
ignore_imports = [
  "spaceapp.modules.** -> spaceapp.modules.*.contracts",
  "spaceapp.modules.** -> spaceapp.modules.*.facade",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "La plataforma no depende de los módulos"
type = "forbidden"
source_modules = ["spaceapp.platform"]
forbidden_modules = ["spaceapp.modules"]

[[tool.importlinter.contracts]]
name = "El dominio no depende de infraestructura"
type = "forbidden"
source_modules = ["spaceapp.modules.*.domain"]
forbidden_modules = ["sqlalchemy", "fastapi", "strawberry", "asyncpg", "alembic", "httpx"]

[[tool.importlinter.contracts]]
name = "Capas dentro de cada módulo: adapters > application > ports > domain"
type = "layers"
containers = ["spaceapp.modules.telemetry", "spaceapp.modules.monitoring", "spaceapp.modules.knowledge", "spaceapp.modules.assistant", "spaceapp.modules.crew", "spaceapp.modules.facility", "spaceapp.modules.engagement", "spaceapp.modules.groundlink", "spaceapp.modules.realtime"]
layers = ["adapters", "application", "ports", "domain"]
