[project]
name = "spaceapp"
version = "0.1.0"
description = "Monitor de salud para astronautas (prototipo de apoyo a la decisión, no es un dispositivo médico)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pypdf>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src"]
