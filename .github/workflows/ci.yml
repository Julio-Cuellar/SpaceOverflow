name: CI

on:
  pull_request:
  push:
    branches: [main, dev-A, dev-B, testing]

# El CI solo lee el código: no necesita permisos de escritura ni secretos.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, tipos, pruebas, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # La cobertura mínima (80 %) está en vite.config.ts: si baja, este paso falla.
      - run: npm run test:coverage
      - run: npm run build
      # Comprueba que el contrato de contracts/ sigue generando tipos.
      - run: npm run codegen

  python:
    name: Python 3.12 (lint, tipos, arquitectura, pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pyproject.toml fija >=3.12,<3.13: es la única versión que prueba el equipo (Dev A y Dev B).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install uv==0.13.8
      # --frozen: si uv.lock no coincide con pyproject.toml, falla en vez de resolver otra vez.
      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      # Las pruebas de integración (outbox, migraciones) levantan PostgreSQL con testcontainers;
      # el runner de GitHub trae Docker. La cobertura mínima es 80 %.
      - run: uv run pytest -q --cov --cov-fail-under=80
