name: CI

on:
  pull_request:
  push:
    branches: [main, dev-A, dev-B, testing]

# El CI solo lee el código: no necesita permisos de escritura ni secretos.
permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, tipos, pruebas, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # La cobertura mínima (80 %) está en vite.config.ts: si baja, este paso falla.
      - run: npm run test:coverage
      - run: npm run build
      # Comprueba que el contrato de contracts/ sigue generando tipos.
      - run: npm run codegen

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 es el mínimo que declara pyproject.toml; 3.14 es la versión de desarrollo.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - run: pytest -q
