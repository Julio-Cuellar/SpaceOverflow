name: CI

on:
  pull_request:
  push:
    branches: [main, dev-A, dev-B, testing]

# CI only reads the code: it needs no write permissions or secrets.
permissions:
  contents: read

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The minimum coverage (80 %) is in vite.config.ts: if it drops, this step fails.
      - run: npm run test:coverage
      - run: npm run build
      # Checks that the contract in contracts/ still generates types.
      - run: npm run codegen

  python:
    name: Python 3.12 (lint, types, architecture, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pyproject.toml pins >=3.12,<3.13: it is the only version the team tests (Dev A and Dev B).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install uv==0.13.8
      # --frozen: if uv.lock does not match pyproject.toml, it fails instead of resolving again.
      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      # Integration tests (outbox, migrations) start PostgreSQL with testcontainers;
      # the GitHub runner ships with Docker. The minimum coverage is 80 %.
      - run: uv run pytest -q --cov --cov-fail-under=80
